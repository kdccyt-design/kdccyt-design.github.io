<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs</title>
    
    <!-- Tab Cloaker: Keeps your Retro Bowl session hidden as Google Docs -->
    <script>
        document.title = "Google Docs - CS Project Notes";
        (function() {
            var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = 'https://gstatic.com';
            document.getElementsByTagName('head').appendChild(link);
        })();
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        nav {
            background-color: #2c3e50;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            z-index: 10;
            border-bottom: 3px solid #18bc9c;
        }
        .back-btn {
            background-color: #18bc9c;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .back-btn:hover {
            background-color: #16a085;
        }
        .game-wrapper {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <!-- Small navigation bar to get back to your main site menu -->
    <nav>
        <a href="index.html" class="back-btn">&larr; Return to Lab Overview</a>
    </nav>

    <div class="game-wrapper">
        <!-- Brand new unblocked mirror URL that loads Retro Bowl directly -->
        <iframe src="https://github.io" allowfullscreen="true"></iframe>
    </div>

</body>
</html>
