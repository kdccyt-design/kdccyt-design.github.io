<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Docs</title>
    
    <!-- Tab Cloaker -->
    <script>
        document.title = "Google Docs - CS Project Notes";
        (function() {
            var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
            link.type = 'image/x-icon';
            link.rel = 'shortcut icon';
            link.href = 'https://gstatic.com';
            document.getElementsByTagName('head').appendChild(link);
        })();
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        nav {
            background-color: #2c3e50;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            z-index: 10;
            border-bottom: 3px solid #18bc9c;
        }
        .back-btn {
            background-color: #18bc9c;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .back-btn:hover {
            background-color: #16a085;
        }
        .game-display {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        canvas {
            image-rendering: pixelated;
            width: 100% !important;
            height: 100% !important;
            max-width: 100vw;
            max-height: calc(100vh - 45px);
            object-fit: contain;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="back-btn">&larr; Return to Lab Overview</a>
    </nav>

    <div class="game-display">
        <!-- Direct native canvas architecture: No iFrames to trigger school filters -->
        <canvas id="canvas" width="960" height="540"></canvas>
    </div>

    <!-- Injecting the open-source web deployment engines directly -->
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <script>
        window.onload = function() {
            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
